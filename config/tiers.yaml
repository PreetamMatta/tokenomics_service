# Capability tier derivation (§6.2): per capability, the relevant Artificial
# Analysis composite index is converted into a 1-5 tier via percentile
# thresholds over the tracked-model population.
#   tier 5: >= P90   tier 4: >= P70   tier 3: >= P40   tier 2: >= P15   else 1

percentile_thresholds:
  5: 90
  4: 70
  3: 40
  2: 15

# AA composite index -> Capability enum value. Indices not listed here are
# preserved raw in ModelCard.quality_indices but derive no tier.
index_capability_map:
  intelligence_index: reasoning
  coding_index: coding
  agentic_index: agentic
  math_index: math
